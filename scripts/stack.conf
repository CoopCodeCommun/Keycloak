# shellcheck shell=bash
# Configuration de scripts/update_stack.sh pour la stack Keycloak.

STACK_NOM=keycloak
DB_SERVICE=keycloack-postgres
KC_SERVICE=keycloak

kc_env() { sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" "$STACK_DIR/.env" | tail -n1 | tr -d "'\""; }
VIRTUAL_HOST="$(kc_env VIRTUAL_HOST)"

# Au-dela de la page d'accueil : la decouverte OIDC lit les realms en base,
# c'est ce qu'utilisent Nextcloud (sociallogin) et les autres services.
SITES_EXTRA="https://$VIRTUAL_HOST/realms/master/.well-known/openid-configuration"

# Copie PHYSIQUE de la base (PostgreSQL arrete, ~20 Mo) avant chaque mise a
# jour, restauree en cas de retour arriere. Indispensable pour Keycloak : une
# nouvelle version migre la base au demarrage, et l'ancienne image ne sait
# pas la relire. Revenir a l'ancienne image seule ne suffirait pas.
SNAPSHOT_DIRS="postgres_data"
SNAPSHOT_SERVICES="$KC_SERVICE $DB_SERVICE"

# Keycloak est fige a une version exacte : un changement est forcement voulu.
CONFIRMER_MINEURE="$KC_SERVICE"
# La base a ete creee sous Debian 12 : pas de changement de glibc en douce.
FIGER_OS="$DB_SERVICE"
# Keycloak met ~30 s a demarrer, plus s'il migre la base.
ATTENTE=300

psql_kc() {
  docker exec -i "$DB_SERVICE" sh -c 'exec psql -X -At -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
}

garde_fous() {
  local ok=0 tag donnees cible base
  # PostgreSQL : le tag doit etre la version des donnees. Une majeure se fait
  # par dump / restauration, pas en changeant d'image (meme avec CONFIRME=1).
  tag="$(kc_env POSTGRES_TAG)"; tag="${tag%%-*}"
  donnees="$(docker exec "$DB_SERVICE" cat /var/lib/postgresql/data/PG_VERSION 2>/dev/null || true)"
  if [ -z "$donnees" ]; then
    log "  REFUS : version des donnees PostgreSQL illisible ($DB_SERVICE arrete ?)." >&2; ok=1
  elif [ "$donnees" != "$tag" ]; then
    log "  REFUS : base en PostgreSQL $donnees, POSTGRES_TAG=$tag. Remettre POSTGRES_TAG=$donnees ;" >&2
    log "          une majeure se fait par dump / restauration (voir README)." >&2; ok=1
  else
    log "PostgreSQL : donnees en $donnees = POSTGRES_TAG. OK"
  fi
  # Keycloak : version exacte, et jamais plus ancienne que la base.
  cible="$(kc_env KEYCLOAK_VERSION)"
  if ! printf '%s' "$cible" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
    log "  REFUS : KEYCLOAK_VERSION=$cible : une version exacte est exigee (ex. 26.0.7)." >&2; ok=1
  else
    base="$(echo "select version from migration_model order by update_time desc limit 1;" | psql_kc 2>/dev/null || true)"
    if [ -n "$base" ] && [ "$(printf '%s\n%s\n' "$base" "$cible" | sort -V | head -n1)" != "$base" ]; then
      log "  REFUS : la base a ete migree en Keycloak $base, KEYCLOAK_VERSION=$cible est plus ancien." >&2; ok=1
    else
      log "Keycloak : base en ${base:-?}, cible $cible. OK"
    fi
  fi
  return $ok
}

# Sauvegarde borg + verification qu'elle est restaurable, avant de toucher.
avant_maj() {
  bash "$SCRIPT_DIR/backup_keycloak.sh"
  bash "$SCRIPT_DIR/check_backup.sh"
}

controle_apres() {
  local ecarts
  # Changement de glibc => index de texte a reconstruire : on veut le savoir.
  ecarts="$(echo "select count(*) from pg_database where datcollversion is not null and datcollversion <> pg_database_collation_actual_version(oid);" | psql_kc)" \
    || { log "PostgreSQL ne repond pas" >&2; return 1; }
  [ "$ecarts" = 0 ] || { log "PostgreSQL : $ecarts base(s) avec une version de collation differente (glibc changee)" >&2; return 1; }
  log "PostgreSQL : collations OK."
  echo "select 1 from realm limit 1;" | psql_kc >/dev/null \
    || { log "Keycloak : table realm illisible" >&2; return 1; }
  local issuer
  issuer="$(curl -s --max-time 15 "https://$VIRTUAL_HOST/realms/master/.well-known/openid-configuration" | jq -r .issuer 2>/dev/null || true)"
  [ "$issuer" = "https://$VIRTUAL_HOST/realms/master" ] \
    || { log "Keycloak : emetteur OIDC inattendu : '${issuer:-aucune reponse}'" >&2; return 1; }
  log "Keycloak : $(docker exec "$KC_SERVICE" /opt/keycloak/bin/kc.sh --version 2>/dev/null | sed -n 's/^Keycloak //p' | head -n1), decouverte OIDC OK."
}
